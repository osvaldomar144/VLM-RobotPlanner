# ─────────────────────────────────────────────────────────────────────────────
# Architecture:
#   HOST  — VLM inference (Qwen3-VL) + pure-Python pipeline (GPU required)
#   DOCKER — ROS 2 Humble + Gazebo Classic + MoveIt 2 + robot control
#
# Communication:
#   network_mode: host  →  ROS 2 DDS multicast is shared; topics visible on host
#   The host can publish task commands and subscribe to camera images directly.
# ─────────────────────────────────────────────────────────────────────────────

services:
  ros2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vlm-robot-planner:latest
    container_name: vlm_ros2

    # Share host network: ROS 2 DDS works across host ↔ container
    network_mode: host

    # Share host IPC namespace: required for MIT-SHM X11 shared memory.
    # Without this, Mesa's software renderer can't transfer pixels to the
    # X server via XShmPutImage → Gazebo viewport shows black.
    ipc: host

    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=42   # valore unico per non mischiarsi con altri utenti ROS2 sul PC
      - VLMRP_REPO_ROOT=/workspace  # repo root for planner/, vlm/, simulation/ imports
      # Gazebo Classic model paths
      - GAZEBO_MODEL_PATH=/usr/share/gazebo-11/models:/workspace/ros2_ws/install/vlm_robot_planner_bringup/share/vlm_robot_planner_bringup/models
      - GAZEBO_RESOURCE_PATH=/usr/share/gazebo-11

    volumes:
      # X11 socket for Gazebo / RViz2 GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Mount ROS2 source files so host edits are immediately visible inside
      # container (colcon --symlink-install makes install/ point here)
      - ../ros2_ws/src:/workspace/ros2_ws/src:rw
      # Pure-Python modules (planner, vlm, simulation) — live edits
      - ../planner:/workspace/planner:rw
      - ../vlm:/workspace/vlm:rw
      - ../simulation:/workspace/simulation:rw
      - ../pddl:/workspace/pddl:rw
      - ../scripts:/workspace/scripts:ro
      # Shared data dir: container writes scene images, host reads them for VLM
      - ../data:/workspace/data:rw
      # Gazebo recordings/screenshots → visibili sull'host in data/gazebo/
      - ../data/gazebo:/root/.gazebo:rw

    devices:
      # GPU for Gazebo rendering (not for VLM — that stays on host)
      - /dev/dri:/dev/dri

    stdin_open: true
    tty: true

    # Default: open a shell. Override to launch simulation directly:
    #   docker compose run ros2 ros2 launch vlm_robot_planner_bringup simulation.launch.py
    command: bash
